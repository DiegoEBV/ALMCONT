<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Coordinador</title>
</head>
<body>
    <h1>Test Login Coordinador</h1>
    <p>Abrir la consola del navegador y ejecutar el script</p>
    
    <script>
        // Script para probar el login del coordinador
        async function testCoordinatorLogin() {
            console.log('=== INICIANDO TEST DE LOGIN COORDINADOR ===');
            
            try {
                // Limpiar sesión anterior
                localStorage.removeItem('almacen_auth_session');
                console.log('✓ Sesión anterior limpiada');
                
                // Simular el proceso de login
                const email = 'coordinador@obra.com';
                const password = '123456';
                
                console.log(`Intentando login con: ${email}`);
                
                // Verificar si existe IndexedDB
                if (!window.indexedDB) {
                    console.error('❌ IndexedDB no está disponible');
                    return;
                }
                
                // Abrir la base de datos
                const dbRequest = indexedDB.open('almacen-db', 1);
                
                dbRequest.onsuccess = function(event) {
                    const db = event.target.result;
                    console.log('✓ Base de datos abierta');
                    console.log('Object stores disponibles:', Array.from(db.objectStoreNames));
                    
                    // Verificar si existe el object store 'usuarios'
                    if (!db.objectStoreNames.contains('usuarios')) {
                        console.error('❌ Object store "usuarios" no encontrado');
                        console.log('Creando sesión manual sin verificar base de datos...');
                        createManualSession();
                        return;
                    }
                    
                    // Obtener usuarios
                    const transaction = db.transaction(['usuarios'], 'readonly');
                    const store = transaction.objectStore('usuarios');
                    const request = store.getAll();
                    
                    request.onsuccess = function() {
                        const usuarios = request.result;
                        console.log('Usuarios encontrados:', usuarios.length);
                        
                        // Buscar el coordinador
                        const coordinador = usuarios.find(u => 
                            u.email === email && 
                            u.password === password && 
                            u.activo
                        );
                        
                        if (coordinador) {
                            console.log('✓ Coordinador encontrado:', coordinador);
                            
                            // Crear sesión manual
                            const authUser = {
                                id: coordinador.id,
                                email: coordinador.email,
                                nombre: coordinador.nombre,
                                apellido: coordinador.apellido,
                                rol: coordinador.rol,
                                obra_id: coordinador.obra_id,
                                activo: coordinador.activo
                            };
                            
                            const session = {
                                user: authUser,
                                token: Math.random().toString(36).substring(2) + Date.now().toString(36),
                                expiresAt: Date.now() + (24 * 60 * 60 * 1000) // 24 horas
                            };
                            
                            // Guardar sesión
                            localStorage.setItem('almacen_auth_session', JSON.stringify(session));
                            console.log('✓ Sesión guardada en localStorage');
                            
                            // Verificar sesión guardada
                            const savedSession = localStorage.getItem('almacen_auth_session');
                            if (savedSession) {
                                console.log('✓ Sesión verificada:', JSON.parse(savedSession));
                                console.log('🎉 LOGIN EXITOSO - Recarga la página para ver los cambios');
                                
                                // Opcional: recargar la página automáticamente
                                setTimeout(() => {
                                    window.location.reload();
                                }, 2000);
                            } else {
                                console.error('❌ Error al guardar la sesión');
                            }
                        } else {
                            console.error('❌ Coordinador no encontrado o credenciales incorrectas');
                            console.log('Usuarios disponibles:', usuarios.map(u => ({
                                email: u.email,
                                rol: u.rol,
                                activo: u.activo
                            })));
                        }
                    };
                    
                    request.onerror = function() {
                        console.error('❌ Error al obtener usuarios:', request.error);
                    };
                };
                
                dbRequest.onerror = function() {
                    console.error('❌ Error al abrir la base de datos:', dbRequest.error);
                };
                
            } catch (error) {
                console.error('❌ Error en el test:', error);
            }
        }
        
        // Función para crear sesión manual cuando no hay base de datos
        function createManualSession() {
            console.log('Creando sesión manual para coordinador...');
            
            // Datos del coordinador desde database.json
            const coordinador = {
                id: "f7b32d35-848c-44db-a4cc-4df45ee48a69",
                email: "coordinador@obra.com",
                nombre: "Juan Carlos",
                apellido: "Coordinador",
                rol: "COORDINACION",
                obra_id: null,
                activo: true
            };
            
            const authUser = {
                id: coordinador.id,
                email: coordinador.email,
                nombre: coordinador.nombre,
                apellido: coordinador.apellido,
                rol: coordinador.rol,
                obra_id: coordinador.obra_id,
                activo: coordinador.activo
            };
            
            const session = {
                user: authUser,
                token: Math.random().toString(36).substring(2) + Date.now().toString(36),
                expiresAt: Date.now() + (24 * 60 * 60 * 1000) // 24 horas
            };
            
            // Guardar sesión
            localStorage.setItem('almacen_auth_session', JSON.stringify(session));
            console.log('✓ Sesión manual guardada en localStorage');
            
            // Verificar sesión guardada
            const savedSession = localStorage.getItem('almacen_auth_session');
            if (savedSession) {
                console.log('✓ Sesión verificada:', JSON.parse(savedSession));
                console.log('🎉 LOGIN MANUAL EXITOSO - Recarga la página para ver los cambios');
                
                // Recargar la página automáticamente
                setTimeout(() => {
                    window.location.href = 'http://localhost:5173';
                }, 2000);
            } else {
                console.error('❌ Error al guardar la sesión manual');
            }
        }
        
        // Ejecutar automáticamente
        window.addEventListener('load', () => {
            console.log('Página cargada. Ejecutando test en 1 segundo...');
            setTimeout(testCoordinatorLogin, 1000);
        });
        
        // También hacer disponible la función globalmente
        window.testCoordinatorLogin = testCoordinatorLogin;
    </script>
</body>
</html>
