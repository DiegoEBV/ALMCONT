<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMACÉN - Sin Conexión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .offline-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .features {
            margin-top: 3rem;
            text-align: left;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .feature-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        
        @media (max-width: 600px) {
            .offline-container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            📦
        </div>
        
        <h1>Sin Conexión</h1>
        
        <p>
            No hay conexión a internet disponible. ALMACÉN funciona en modo offline 
            con datos almacenados localmente.
        </p>
        
        <a href="/" class="retry-btn" onclick="window.location.reload()">
            Reintentar Conexión
        </a>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Consultar stock almacenado</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Ver materiales guardados</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Acceder a obras recientes</span>
            </div>
            <div class="feature">
                <div class="feature-icon">⏳</div>
                <span>Los cambios se sincronizarán automáticamente</span>
            </div>
        </div>
    </div>
    
    <script>
        // Verificar conexión periódicamente
        function checkConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            }
        }
        
        // Verificar cada 5 segundos
        setInterval(checkConnection, 5000);
        
        // Escuchar eventos de conexión
        window.addEventListener('online', () => {
            window.location.href = '/';
        });
        
        // Mostrar estado de conexión
        window.addEventListener('offline', () => {
            console.log('Aplicación en modo offline');
        });
    </script>
</body>
</html>
